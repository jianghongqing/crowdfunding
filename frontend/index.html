<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdFund Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 12px; }
    h1 { margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 12px 0; }
    .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    input, select { padding: 8px; min-width: 180px; }
    button { padding: 8px 12px; cursor: pointer; }
    #log { white-space: pre-wrap; background: #111; color: #d5ffd5; padding: 10px; border-radius: 8px; min-height: 80px; max-height: 200px; overflow-y: auto; font-size: 13px; }
    .muted { color: #666; font-size: 13px; }
    .campaign-row { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin: 6px 0; cursor: pointer; transition: background 0.15s; }
    .campaign-row:hover { background: #f5f5f5; }
    .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .badge-active { background: #e3f2fd; color: #1976d2; }
    .badge-goal { background: #fff3e0; color: #f57c00; }
    .badge-success { background: #e8f5e9; color: #388e3c; }
    .badge-failed { background: #fce4ec; color: #c62828; }
  </style>
</head>
<body>
  <h1>CrowdFund</h1>
  <p class="muted">选择网络后连接钱包，可浏览活动列表、查看详情、以及发起 create / fund / withdraw / refund 操作。</p>

  <div class="card">
    <div class="row">
      <label class="muted" for="networkSelect">网络</label>
      <select id="networkSelect" style="padding:8px; min-width:200px;">
        <option value="sepolia">Sepolia 测试网</option>
        <option value="anvil">本地 Anvil (127.0.0.1:8545)</option>
      </select>
    </div>
    <div class="row">
      <input id="contractAddress" placeholder="合约地址自动加载中..." style="min-width:340px;" />
      <button id="connectBtn">连接钱包</button>
    </div>
    <div id="walletInfo" class="muted">钱包未连接</div>
  </div>

  <div class="card" id="campaignListCard">
    <h3>活动列表 <button id="loadCampaignsBtn" style="font-size:12px; margin-left:8px;">刷新</button></h3>
    <div id="campaignList" class="muted">正在加载...</div>
  </div>

  <div class="card" id="campaignDetailCard" style="display:none;">
    <h3>活动详情 <button id="backToListBtn" style="font-size:12px; margin-left:8px;">返回列表</button></h3>
    <div id="campaignDetail"></div>
    <h4 style="margin-bottom:4px;">捐款记录</h4>
    <div id="contributionList" class="muted"></div>
  </div>

  <div class="card">
    <h3>创建活动 createCampaign</h3>
    <div class="row">
      <input id="createTitle" placeholder="标题" />
      <input id="createGoalEth" placeholder="目标金额(ETH), e.g. 1.5" />
      <input id="createDuration" placeholder="持续秒数, e.g. 86400" />
      <button id="createBtn">创建</button>
    </div>
  </div>

  <div class="card">
    <h3>捐款 fund</h3>
    <div class="row">
      <input id="fundCampaignId" placeholder="campaignId" />
      <input id="fundAmountEth" placeholder="捐款(ETH), e.g. 0.1" />
      <button id="fundBtn">捐款</button>
    </div>
  </div>

  <div class="card">
    <h3>提款 withdraw</h3>
    <div class="row">
      <input id="withdrawCampaignId" placeholder="campaignId" />
      <button id="withdrawBtn">提款</button>
    </div>
  </div>

  <div class="card">
    <h3>退款 refund</h3>
    <div class="row">
      <input id="refundCampaignId" placeholder="campaignId" />
      <button id="refundBtn">退款</button>
    </div>
  </div>

  <div class="card">
    <h3>日志</h3>
    <div id="log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
